name: Forever Frequency — actual 13 GLB Android ARM64 package

on:
  push:
    branches: [forever-frequency-native]
    paths: ['.github/workflows/forever-frequency-13glb-android.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-premium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4
      - name: Download exact approved 13 Blender GLBs
        uses: actions/download-artifact@v4
        with:
          name: Premium-Forever-Frequency-13-GLB-Blender-Kit
          repository: 1993velezpadilla-source/Drag-mini
          run-id: 45322388388
          github-token: ${{ github.token }}
          path: forever-frequency-native/assets
      - name: Validate runtime assets and exclude authoring-only files
        shell: bash
        run: |
          set -euo pipefail
          find forever-frequency-native/assets -maxdepth 1 -name '*.blend' -delete
          rm -f forever-frequency-native/assets/studio_entrance.glb forever-frequency-native/assets/street_kiosk.glb
          test "$(find forever-frequency-native/assets -maxdepth 1 -name '*.glb' | wc -l)" -eq 13
          test -s forever-frequency-native/assets/urban_life_district.glb
          test -s forever-frequency-native/assets/la_caldera_records.glb
      - name: Configure Android export for Godot 4.4
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          export ANDROID_HOME=/usr/lib/android-sdk
          printf 'y\ny\ny\ny\n' | sdkmanager --sdk_root="$ANDROID_HOME" 'build-tools;34.0.0' 'platforms;android-34' 'platform-tools'
          test -s "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
      - name: Import actual Blender assets into Android project
        shell: bash
        run: |
          set -o pipefail
          timeout 420s godot --headless --path forever-frequency-native --editor --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Real models + game state regression suite
        shell: bash
        env:
          FOREVER_REQUIRE_MODELS: '1'
        run: |
          set -o pipefail
          timeout 90s godot --headless --path forever-frequency-native --script res://tests/gauntlet.gd 2>&1 | tee gauntlet.log
          grep 'GAUNTLET GREEN' gauntlet.log
      - name: Export and sign Android 64-bit APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p /root/.android out
          keytool -genkeypair -keystore /root/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Forever Frequency,C=US"
          godot --headless --path forever-frequency-native --export-debug Android "$PWD/out/Forever_Frequency_Premium_13GLB_ARM64.apk" 2>&1 | tee export.log
          test -s out/Forever_Frequency_Premium_13GLB_ARM64.apk
          python3 - <<'PY'
          import zipfile,glob
          p=glob.glob('out/*.apk')[0]
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert any('arm64-v8a' in x for x in names),'missing arm64 engine'
              assert any('urban_life_district' in x for x in names),'missing premium city asset in APK'
              assert any('la_caldera_records' in x for x in names),'missing recording studio model in APK'
              print('13 GLB PREMIUM ANDROID ARTIFACT GREEN',len(names),'zip members')
          PY
      - name: Upload APK and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forever-Frequency-Premium-13GLB-Android-ARM64
          path: |
            out/*.apk
            import.log
            gauntlet.log
            export.log
          if-no-files-found: warn
