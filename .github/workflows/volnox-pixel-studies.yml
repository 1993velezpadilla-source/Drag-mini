name: Volnox 2D pixel art studies
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths:
      - 'my-forever-pet/godot-arcade/pixel_pet_art.gd'
      - 'my-forever-pet/tests/volnox_pixel_studies.gd'
      - '.github/workflows/volnox-pixel-studies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p /tmp/pixel
          printf 'config_version=5\n[application]\nconfig/name="Volnox pixels"\n' >/tmp/pixel/project.godot
          cp my-forever-pet/godot-arcade/{pixel_pet_art,pet_part_rig,pet_external_fx}.gd my-forever-pet/tests/volnox_pixel_studies.gd /tmp/pixel/
          set -o pipefail
          timeout 60 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path /tmp/pixel --script res://volnox_pixel_studies.gd 2>&1 | tee /tmp/volnox-pixel.log
          grep -F 'VOLNOX_2D_PIXEL_PILOT_PASS 3' /tmp/volnox-pixel.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' /tmp/volnox-pixel.log
      - name: Render real Godot spatial shader on 2D sprite quads
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          cp my-forever-pet/godot-arcade/volnox_pixel_life.gdshader my-forever-pet/tests/volnox_shader_review.gd /tmp/pixel/
          printf '\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' >>/tmp/pixel/project.godot
          xvfb-run -a timeout 60 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --path /tmp/pixel --audio-driver Dummy --script res://volnox_shader_review.gd 2>&1 | tee /tmp/volnox-shader.log
          grep -F VOLNOX_PIXEL_SHADER_VIEW_PASS /tmp/volnox-shader.log
          ! grep -E 'SCRIPT ERROR|Parse Error|SHADER ERROR|Assertion failed' /tmp/volnox-shader.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Volnox-2D-pixel-studies-unapproved
          path: |
            /tmp/*-pixel-atlas.png
            /tmp/volnox-pixel.log
            /tmp/volnox-shader-preview.png
            /tmp/volnox-shader.log
