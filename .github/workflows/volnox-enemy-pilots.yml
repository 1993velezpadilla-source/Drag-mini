name: Volnox original enemy Blender pilots
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths:
      - 'my-forever-pet/art/blender_volnox_pilot.py'
      - '.github/workflows/volnox-enemy-pilots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y blender xvfb libgl1-mesa-dri python3-pil
      - name: Render independently animated original anatomy pilots
        run: |
          set -euo pipefail
          xvfb-run -a blender -b -t 4 --python-exit-code 1 -P my-forever-pet/art/blender_volnox_pilot.py -- /tmp/volnox-pilots
          test "$(find /tmp/volnox-pilots -name '*.png' | wc -l)" -eq 108
          test "$(find /tmp/volnox-pilots -name '*.blend' | wc -l)" -eq 3
      - name: Verify frames and assemble review atlases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for folder in sorted(Path('/tmp/volnox-pilots').iterdir()):
              atlas=Image.new('RGBA',(864,384))
              for y,d in enumerate(('front','back','left','right')):
                  frames=[]
                  for i in range(1,10):
                      im=Image.open(folder/f'{d}_{i:02}.png').convert('RGBA')
                      assert im.size==(96,96) and im.getchannel('A').getextrema()==(0,255)
                      frames.append(im.tobytes())
                      atlas.paste(im,((i-1)*96,y*96))
                  assert len(set(frames[1:5]))>=3, (folder,d,'walk')
                  assert len(set(frames[5:9]))>=3, (folder,d,'attack')
              atlas.save(folder/'review_atlas.png')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Volnox-Blender-anatomy-pilots-not-approved
          path: /tmp/volnox-pilots/
