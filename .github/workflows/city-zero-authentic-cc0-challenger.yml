name: City Zero - REAL licensed CC0 Dodge Challenger 1970 Blender asset
on:
  push:
    branches: [forever-frequency-native]
    paths:
      - '.github/workflows/city-zero-authentic-cc0-challenger.yml'
      - 'forever-frequency-native/tools/import_real_cc0_dodge_challenger.py'
      - 'forever-frequency-native/tests/challenger_real_godot_capture.gd'
  workflow_dispatch:
concurrency:
  group: cityzero-original-cc0-dodge-challenger
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  actual-authored-cc0-mesh:
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Download genuine CC0 original O3DE vehicle FBX and prefab from pinned GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/pawelbudziszewski/o3de-sample-vehicle-assets/6047f2b431708202c37b196ee7cced94ff2fc302/Assets/Vehicles/Dodge_Challenger_1970_rt'
          target=forever-frequency-native/assets/licensed_cc0_challenger_source
          mkdir -p "$target/textures"
          for src in dodge-challenger-1970-r-t_body.fbx dodge-challenger-1970-r-t_wheel.fbx dodge-challenger-1970-r-t_steering_wheel.fbx; do
            curl -fL --retry 4 --connect-timeout 20 --max-time 220 -o "$target/$src" "$base/Models/$src"
            test -s "$target/$src"
          done
          curl -fL --retry 4 --connect-timeout 20 -o "$target/Dodge_Challenger_1970_RT.prefab" "$base/Dodge_Challenger_1970_RT.prefab"
          # Preserve authentic source lighting/metal/paint/wheel/normal maps,
          # not placeholder colors! All 30 files are original upstream maps.
          curl -fsSL --retry 4 "https://api.github.com/repos/pawelbudziszewski/o3de-sample-vehicle-assets/git/trees/6047f2b431708202c37b196ee7cced94ff2fc302?recursive=1" |
            python3 -c 'import json,sys; d=json.load(sys.stdin); p="Assets/Vehicles/Dodge_Challenger_1970_rt/Materials/textures/"; x=[v["path"][len(p):] for v in d["tree"] if v["path"].startswith(p) and v["type"]=="blob"]; assert len(x)==30; print("\n".join(x))' > "$target/original_texture_names.txt"
          while IFS= read -r filename; do
            test -n "$filename" || continue
            curl -fsSL --retry 4 --connect-timeout 20 --max-time 90 -o "$target/textures/$filename" "$base/Materials/textures/$filename"
            test -s "$target/textures/$filename"
          done < "$target/original_texture_names.txt"
          test "$(find "$target/textures" -type f | wc -l)" -eq 30
          test "$(wc -c < "$target/dodge-challenger-1970-r-t_body.fbx")" -gt 40000000
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('forever-frequency-native/assets/licensed_cc0_challenger_source')
          p=json.loads((d/'Dodge_Challenger_1970_RT.prefab').read_text())
          assert sum(x.get('Name','') in ('Wheel FL','Wheel FR','Wheel RL','Wheel RR') for x in p['Entities'].values())==4
          print('GENUINE PINNED O3DE CC0 ORIGINAL FBX DOWNLOADED WITH ALL FOUR ACTUAL WHEEL ANCHORS')
          PY
          python3 -m py_compile forever-frequency-native/tools/import_real_cc0_dodge_challenger.py
      - name: Original source and permission declaration
        run: |
          printf '%s\n' \
            'Artist original: https://blendswap.com/blend/4046' \
            'Artist source licensing displayed: CC0' \
            'O3DE adaptation: https://github.com/pawelbudziszewski/o3de-sample-vehicle-assets' \
            'Pinned adaptation revision: 6047f2b431708202c37b196ee7cced94ff2fc302' \
            'DO NOT CALL SHIP-READY before screenshot/door/mobility review' \
            > forever-frequency-native/assets/licensed_cc0_challenger_source/PROVENANCE.txt
      - name: Download Blender 4.5
        run: docker pull ghcr.io/blenderkit/headless-blender:blender-4.5-stable
      - name: Import original CC0 Dodge into Blender and prove actual source geometry and wheels
        shell: bash
        run: |
          set -euo pipefail
          cd forever-frequency-native
          timeout 600s docker run --rm --entrypoint /home/headless/blender/blender -v "$PWD:$PWD" -w "$PWD" ghcr.io/blenderkit/headless-blender:blender-4.5-stable -b -t 2 --python tools/import_real_cc0_dodge_challenger.py 2>&1 | tee CC0_DODGE_1970_REAL_BLENDER.log
          grep -q 'GENUINE CC0 DODGE CHALLENGER SOURCE BLENDER FOUR VIEW GATE COMPLETE' CC0_DODGE_1970_REAL_BLENDER.log
      - name: Validate actual car four-view evidence, not AI
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('forever-frequency-native')
          d=root/'real_cc0_challenger_blender_proof'
          j=json.loads((d/'original_cc0_import_report.json').read_text())
          assert j['body_source_triangles']>25000
          assert len(j['wheels'])==4
          assert j['game_ready']==False
          assert 'CC0' in j['original_source_license']
          assert (root/'assets/licensed_cc0_automobiles/dodge_challenger_1970_rt_original_cc0.glb').stat().st_size>300000
          assert len(list(d.glob('*.png')))==4
          print('GENUINE LICENSED CLASSIC CHALLENGER GEOMETRY/BLENDER FOUR VIEWS GREEN, NOT GAME READY')
          PY
      - name: Upload actual downloadable CC0 Dodge GLB, Blender, source credits and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CityZero-REAL-CC0-Dodge-Challenger-1970-Blender-GLB-Four-Views
          retention-days: 90
          path: |
            forever-frequency-native/assets/licensed_cc0_automobiles/*
            forever-frequency-native/real_cc0_challenger_blender_proof/*
            forever-frequency-native/assets/licensed_cc0_challenger_source/PROVENANCE.txt
            forever-frequency-native/CC0_DODGE_1970_REAL_BLENDER.log
          if-no-files-found: warn

  authentic-godot-3-view-proof:
    needs: actual-authored-cc0-mesh
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Download EXACT original Blender-authored CC0 GLB from preceding job
        uses: actions/download-artifact@v4
        with:
          name: CityZero-REAL-CC0-Dodge-Challenger-1970-Blender-GLB-Four-Views
          path: genuine-source
      - name: Verify source GLB and set up isolated native Godot project
        shell: bash
        run: |
          set -euo pipefail
          file=genuine-source/assets/licensed_cc0_automobiles/dodge_challenger_1970_rt_original_cc0.glb
          test -s "$file"
          test "$(head -c 4 "$file")" = glTF
          mkdir -p isolated/assets/licensed_cc0_automobiles isolated/tests
          cp "$file" isolated/assets/licensed_cc0_automobiles/
          cp forever-frequency-native/tests/challenger_real_godot_capture.gd isolated/tests/
          cat > isolated/project.godot <<'GODOT'
          config_version=5
          [application]
          config/name="City Zero REAL 1970 CC0 Dodge evidence"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=800
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          GODOT
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: false
      - name: Install REAL software OpenGL window renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libegl1 mesa-utils
      - name: Godot 4 imports real non-procedural Blender GLB
        shell: bash
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 xvfb-run -a -s '-screen 0 1600x900x24' timeout 180s godot --rendering-driver opengl3 --rendering-method gl_compatibility --path isolated --editor --import --quit 2>&1 | tee challenger-godot-import.log
          test -s isolated/assets/licensed_cc0_automobiles/dodge_challenger_1970_rt_original_cc0.glb.import
          grep -q '\[remap\]' isolated/assets/licensed_cc0_automobiles/dodge_challenger_1970_rt_original_cc0.glb.import
      - name: Save three actual Godot screenshots and hide-mesh difference proofs
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set -euo pipefail
          mkdir -p "$PWD/challenger-in-game-evidence"
          export CITYZERO_CHALLENGER_SCREENSHOTS="$PWD/challenger-in-game-evidence"
          xvfb-run -a -s '-screen 0 1600x900x24' timeout 200s godot --path isolated --script res://tests/challenger_real_godot_capture.gd 2>&1 | tee challenger-in-game-evidence/godot-capture.log
          grep -q 'CITYZERO_REAL_CHALLENGER_3_GODOT_FRAMES_GREEN' challenger-in-game-evidence/godot-capture.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('challenger-in-game-evidence')
          report=json.loads((root/'real_challenger_godot_proof.json').read_text())
          assert report['genuine_rendered_triangles']>25000
          assert len(report['shots'])==3
          assert all(x['actual_mesh_pixel_samples']>175 for x in report['shots'])
          assert all(Path(x['image']).stat().st_size>25000 for x in report['shots'])
          assert report['game_ready'] is False
          print('THREE AUTHENTIC CHALLENGER GODOT FRAMES, NOT AI-GENERATED')
          PY
      - name: Deliver authentic game screenshots, Blender source and Godot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CityZero-Dodge-1970-REAL-3-Godot-Game-Images-and-Proof
          retention-days: 90
          path: |
            challenger-in-game-evidence/
            challenger-godot-import.log
          if-no-files-found: warn
