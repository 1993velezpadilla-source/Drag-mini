name: Kindria cinematic gauntlet
on:
  workflow_dispatch:
  push:
    branches:
      - feature/my-forever-pet-paradise
    paths:
      - 'my-forever-pet/godot-arcade/**'
      - '.github/workflows/kindria-cinematic-gauntlet.yml'
permissions:
  contents: read
concurrency:
  group: kindria-cinematic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: my-forever-pet/godot-arcade
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import project
        run: |
          set -o pipefail
          Godot_v4.5.1-stable_linux.x86_64 --headless --editor --import --path . 2>&1 | tee /tmp/kindria-import.log
          if grep -E 'SCRIPT ERROR: Parse Error|Failed to load script' /tmp/kindria-import.log; then exit 1; fi
      - name: Run actual Godot cinematic tests
        run: |
          set -o pipefail
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://cinematic_gauntlet.gd 2>&1 | tee /tmp/kindria-test.log
          if grep -E 'SCRIPT ERROR:|Failed to load script|Invalid call|Invalid assignment|Invalid access' /tmp/kindria-test.log; then exit 1; fi
          grep -E 'CINEMATIC_GAUNTLET checks=[0-9]+ failures=0' /tmp/kindria-test.log
      - name: Verify visual exports
        run: |
          python3 - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path("/tmp/kindria-visual")
          index = json.loads((root / "index.json").read_text())
          assert len(index) == 18, len(index)
          seen = set()
          for element, rows in index.items():
              for row in rows:
                  move = row["id"]
                  assert move not in seen, move
                  seen.add(move)
                  data = (root / element / (move + ".png")).read_bytes()
                  assert data[:8] == b"\x89PNG\r\n\x1a\n", move
                  assert struct.unpack(">II", data[16:24]) == (576, 48), move
                  assert len(row["frame_areas"]) == 12, move
          assert len(seen) == 589, len(seen)
          assert len(list(root.rglob("*.png"))) == 589
          print("KINDRIA_VISUAL_ARTIFACT validated=589 frames=7068 elements=18")
          # Advisory visual similarity: compare four phases of actual rendered
          # alpha occupancy and premultiplied colors, including cross-element pairs.
          from itertools import combinations
          rows = []
          for element, moves in index.items():
              for move in moves:
                  phases = move["visual_signature"]
                  assert len(phases) == 4 and all(len(p) == 36 for p in phases), move["id"]
                  cells = [c for phase in phases for c in phase]
                  assert all(len(c) == 4 and all(0 <= x <= 255 for x in c) for c in cells), move["id"]
                  shape = [c[0] for c in cells]
                  color = [v for c in cells for v in c[1:]]
                  rows.append((element, move["id"], move["name"], shape, color, sum(shape), sum(color)))
          pairs = []
          for a, b in combinations(rows, 2):
              # Weighted Dice overlap in space and time; robust to small pixel changes.
              mass = a[5] + b[5]
              if not mass or 2 * min(a[5], b[5]) / mass < .82:
                  continue
              shape = 1 - sum(abs(x-y) for x,y in zip(a[3], b[3])) / mass
              if shape < (.82 if a[0] == b[0] else .88):
                  continue
              cmass = a[6] + b[6]
              color = 1 - sum(abs(x-y) for x,y in zip(a[4], b[4])) / max(1, cmass)
              score = .75 * shape + .25 * color
              pairs.append(dict(a=a[1], b=b[1], name_a=a[2], name_b=b[2], element_a=a[0], element_b=b[0], shape=round(shape, 4), color=round(color, 4), score=round(score, 4)))
          pairs.sort(key=lambda p: (p["shape"], p["score"]), reverse=True)
          report = {"moves": len(rows), "pairs_compared": len(rows)*(len(rows)-1)//2, "phase_frames": [1,4,7,10], "grid": [6,6], "same_element_shape_threshold": .82, "cross_element_shape_threshold": .88, "candidates": pairs}
          (root / "similarity-review.json").write_text(json.dumps(report, indent=2))
          print("KINDRIA_SIMILARITY moves=%d pairs_compared=%d candidates=%d" % (len(rows), report["pairs_compared"], len(pairs)))
          for pair in pairs[:40]:
              print("KINDRIA_SIMILARITY_PAIR " + json.dumps(pair, ensure_ascii=False))
          PY
      - name: Preserve actual attack frame strips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindria-visual-review
          path: /tmp/kindria-visual/
          if-no-files-found: warn
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindria-cinematic-logs
          path: /tmp/kindria-*.log
