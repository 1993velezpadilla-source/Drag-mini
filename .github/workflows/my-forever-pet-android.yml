name: My Forever Pet Android
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths: ['my-forever-pet/**', '.github/workflows/my-forever-pet-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: my-forever-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify standalone simulation
        run: |
          mkdir -p /tmp/pet-test
          javac -d /tmp/pet-test app/src/main/java/org/myforeverpet/paradise/PetState.java app/src/main/java/org/myforeverpet/paradise/PlaydateRules.java app/src/main/java/org/myforeverpet/paradise/Arcade.java app/src/main/java/org/myforeverpet/paradise/Economy.java tests/PetStateTest.java
          java -cp /tmp/pet-test org.myforeverpet.paradise.PetStateTest
      - name: Install Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null || true
          "$SDK" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build standalone APK using Android SDK only
        run: bash build-sdk.sh
      - name: Verify APK standalone
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if unzip -l "$APK" | grep -E 'libforever_pet.so|\.tamasave|firmware\.bin'; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: My-Forever-Pet-Standalone-0.12-debug
          path: my-forever-pet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: My-Forever-Pet-Standalone-0.12-debug
          path: /tmp/pet-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash my-forever-pet/tests/android-smoke.sh /tmp/pet-apk/app-debug.apk
      - name: Visual review contact sheet
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import base64, pathlib, subprocess
          p=pathlib.Path("/tmp/pet-screens/baby.png")
          if p.is_file():
              encoded=base64.b64encode(p.read_bytes()).decode("ascii")
              for i in range(0,len(encoded),3000): print("PET_SCREEN_CHUNK:"+encoded[i:i+3000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: My-Forever-Pet-real-Android-screens
          path: /tmp/pet-screens
          if-no-files-found: warn
