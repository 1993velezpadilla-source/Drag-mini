name: My Forever Pet Android
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths: ['my-forever-pet/**', '.github/workflows/my-forever-pet-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: my-forever-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify standalone simulation
        run: |
          mkdir -p /tmp/pet-test
          javac -d /tmp/pet-test app/src/main/java/org/myforeverpet/paradise/PetState.java app/src/main/java/org/myforeverpet/paradise/PlaydateRules.java tests/PetStateTest.java
          java -cp /tmp/pet-test org.myforeverpet.paradise.PetStateTest
      - name: Install Android SDK
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null || true
          "$SDK" 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug
      - name: Verify APK standalone
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if unzip -l "$APK" | grep -E 'libforever_pet.so|\.tamasave|firmware\.bin'; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: My-Forever-Pet-Standalone-0.3-debug
          path: my-forever-pet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
