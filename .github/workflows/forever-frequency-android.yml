name: Forever Frequency - Blender to Android gauntlet

on:
  push:
    branches: [forever-frequency-native]
    paths:
      - 'forever-frequency-native/**'
      - '.github/workflows/forever-frequency-android.yml'
  workflow_dispatch:

permissions:
  contents: read

# Each new adversarial revision supersedes the previous build.
# Stop flooding Blender/Apt runners with stale renders while reviewing latest.
concurrency:
  group: forever-frequency-premium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-assets:
    name: Blender original 3D assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Blender package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy python3-pil python3-requests
          blender --version
          blender -b -t 2 --python-expr 'import numpy; print("NUMPY IMPORT GREEN", numpy.__version__)'
      - name: Generate editable Blender models + GLB
        run: |
          cd forever-frequency-native
          blender -b -t 2 --python tools/build_assets_blender.py
          test -s assets/studio_entrance.glb
          test -s assets/street_kiosk.glb
          test -s assets/city_zero_modular.blend
      - name: Download verified CC0 PBR material maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forever-frequency-native/pbr_sources
          for mat in Bricks066 Concrete012; do
            for map in Color Roughness NormalGL; do
              file="${mat}_2K-JPG_${map}.jpg"
              curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
                "https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main/environment/ground-textures/ambientcg/${mat}_2K-JPG/${file}" \
                -o "forever-frequency-native/pbr_sources/${file}"
              test "$(stat -c %s "forever-frequency-native/pbr_sources/${file}")" -gt 10000
            done
          done
      - name: Prepare mobile PBR street textures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forever-frequency-native/assets
          curl --fail --location --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main/environment/ground-textures/ambientcg/Asphalt021_2K-JPG/Asphalt021_2K-JPG_Color.jpg' \
            -o /tmp/asphalt.jpg
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          target=Path('forever-frequency-native/assets')
          source={'road_asphalt.jpg':'/tmp/asphalt.jpg',
                  'sidewalk_concrete.jpg':'forever-frequency-native/pbr_sources/Concrete012_2K-JPG_Color.jpg'}
          for dst,src in source.items():
              with Image.open(src) as im:
                  im.convert('RGB').resize((1024,1024),Image.Resampling.LANCZOS).save(target/dst,'JPEG',quality=80,optimize=True)
              assert (target/dst).stat().st_size>50000, dst
              print('MOBILE PBR TEXTURE READY',dst,(target/dst).stat().st_size)
          PY
      - name: Premium architecture geometry pass (strict Blender gate)
        shell: bash
        run: |
          cd forever-frequency-native
          blender -b -t 2 --python tools/premium_art_pass.py 2>&1 | tee premium_art.log
          grep 'PREMIUM BLENDER ART PASS GREEN' premium_art.log
          python3 - <<'PY'
          import json
          report=json.load(open('assets/premium_detail_metrics.json'))
          assert len(report)==4,report
          assert report['la_caldera_records'] >= 30,report
          assert sum(report.values()) > 120,report
          print('ARCHITECTURAL DETAIL GATE GREEN',report)
          PY
      - name: PBR material upgrade and mesh batching in Blender
        shell: bash
        run: |
          cd forever-frequency-native
          blender -b -t 2 --python tools/pbr_upgrade.py | tee pbr_gauntlet.log
          grep 'PBR-GAUNTLET GREEN' pbr_gauntlet.log
          python3 - <<'PY'
          import json
          j=json.load(open('assets/mesh_metrics.json'))
          assert len(j)==12
          for k,v in j.items():
              assert v['export_nodes'] < v['source_meshes'], (k,v)
          print('ASSET METRICS PASS',sum(v['source_meshes'] for v in j.values()),'to',sum(v['export_nodes'] for v in j.values()),'nodes')
          PY
      - name: Source 2 genuinely sculpted CC0 nature assets for Blender
        shell: bash
        run: |
          mkdir -p forever-frequency-native/pbr_sources/nature
          for asset in Tree Bush; do
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
              "https://raw.githubusercontent.com/petroulacl/fps-buildings-env-kit/main/environment/vegetation/polypizza-stylized-nature-gltf/${asset}.glb" \
              -o "forever-frequency-native/pbr_sources/nature/${asset}.glb"
            test "$(stat -c %s "forever-frequency-native/pbr_sources/nature/${asset}.glb")" -gt 100000
          done
      - name: Blender-crafted living city district and performance gate
        shell: bash
        run: |
          cd forever-frequency-native
          blender -b -t 2 --python tools/urban_life_district.py 2>&1 | tee premium_district.log
          grep 'URBAN PREMIUM GAUNTLET GREEN' premium_district.log
          python3 - <<'PY'
          import json
          j=json.load(open('assets/urban_metrics.json'))
          assert j['original_meshes'] >= 600,j
          assert j['runtime_batches'] < 20,j
          assert j['district_facades'] >= 9,j
          assert j['size_bytes'] < 35000000,j
          print('BLENDER DISTRICT GATE GREEN',j)
          PY
      - name: Upload model kit
        uses: actions/upload-artifact@v4
        with:
          name: forever-frequency-blender-source
          path: |
            forever-frequency-native/assets/*.glb
            forever-frequency-native/assets/*.blend
            forever-frequency-native/assets/mesh_metrics.json
            forever-frequency-native/assets/urban_metrics.json
            forever-frequency-native/assets/premium_detail_metrics.json
            forever-frequency-native/assets/*.jpg
          if-no-files-found: error

  android:
    name: Native Godot ARM64 — adversarial gauntlet & APK
    needs: model-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forever-frequency-blender-source
          path: forever-frequency-native/assets
      - name: Keep Blender editables outside Godot import tree
        shell: bash
        run: |
          # .blend is only a SOURCE asset, not a Godot runtime asset.
          # Godot's native Blender importer can hang in CI when it auto-scans it.
          find forever-frequency-native/assets -maxdepth 1 -name '*.blend' -print -delete
          rm -f forever-frequency-native/assets/studio_entrance.glb forever-frequency-native/assets/street_kiosk.glb
          test "$(find forever-frequency-native/assets -maxdepth 1 -name '*.glb' | wc -l)" -eq 13
      - name: Mount Godot's preinstalled Android export templates and editor settings
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"
          grep 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Install Python and Godot 4.4 Android SDK requirements
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
          export ANDROID_HOME=/usr/lib/android-sdk
          printf 'y\ny\ny\ny\n' | sdkmanager --sdk_root="$ANDROID_HOME" 'build-tools;34.0.0' 'platforms;android-34' 'platform-tools'
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          python3 --version
      - name: Enforce original orange Lamborghini and reject all 103 unapproved vehicles in Android export
        run: python3 forever-frequency-native/tools/check_owner_visual_quality_gate.py --shipping
      - name: Source-level adversarial audit
        run: python3 forever-frequency-native/tools/adversarial_audit.py
      - name: Check engine and export templates
        shell: bash
        run: |
          godot --version
          ls -lah /root/.local/share/godot/export_templates/ || true
      - name: Import Godot project and validate scripts
        shell: bash
        run: |
          godot --headless --path forever-frequency-native --editor --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' import.log; then exit 1; fi
      - name: Core-gameplay gauntlet
        shell: bash
        env:
          FOREVER_REQUIRE_MODELS: '1'
        run: |
          godot --headless --path forever-frequency-native --script res://tests/gauntlet.gd 2>&1 | tee gauntlet.log
          if grep -E 'SCRIPT ERROR|Parse Error|GAUNTLET RED' gauntlet.log; then exit 1; fi
          grep 'GAUNTLET GREEN' gauntlet.log
      - name: Generate temporary Android debug signing certificate
        shell: bash
        run: |
          mkdir -p /root/.android
          keytool -genkeypair -v -keystore /root/.android/debug.keystore -alias androiddebugkey -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 9000 -dname 'CN=Android Debug,O=Forever Frequency,C=US'
      - name: Build ARM64 test APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p out
          godot --headless --path forever-frequency-native --export-debug 'Android' "$PWD/out/Forever_Frequency_City_Zero_ARM64.apk" 2>&1 | tee export.log
          test -s out/Forever_Frequency_City_Zero_ARM64.apk
          ls -lh out/Forever_Frequency_City_Zero_ARM64.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forever-Frequency-City-Zero-Native-Android-ARM64
          path: out/Forever_Frequency_City_Zero_ARM64.apk
          if-no-files-found: error
      - name: Upload logs (adversarial audit evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forever-Frequency-Gauntlet-Logs
          path: |
            import.log
            gauntlet.log
            export.log
          if-no-files-found: ignore

  capture:
    name: Actual Godot gameplay screenshot (not concept art)
    needs: model-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.4
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forever-frequency-blender-source
          path: forever-frequency-native/assets
      - name: Keep Blender editables outside Godot import tree
        shell: bash
        run: |
          # .blend is only a SOURCE asset, not a Godot runtime asset.
          # Godot's native Blender importer can hang in CI when it auto-scans it.
          find forever-frequency-native/assets -maxdepth 1 -name '*.blend' -print -delete
          rm -f forever-frequency-native/assets/studio_entrance.glb forever-frequency-native/assets/street_kiosk.glb
          test "$(find forever-frequency-native/assets -maxdepth 1 -name '*.glb' | wc -l)" -eq 13
      - name: Mount Godot's preinstalled Android export templates and editor settings
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"
          grep 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
      - name: Install X virtual display and real image critic
        run: apt-get update -qq && apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 python3 python3-pil
      - name: Import and run real 3D render
        shell: bash
        run: |
          godot --headless --path forever-frequency-native --editor --import --quit
          xvfb-run -a -s '-screen 0 1280x720x24' godot --path forever-frequency-native --rendering-method gl_compatibility --script res://tests/capture.gd
          test -s forever-frequency-native/preview_real_godot.png
          test -s forever-frequency-native/preview_city_aerial.png
          test -s forever-frequency-native/preview_market_street.png
          test -s forever-frequency-native/preview_studio_closeup.png
          python3 forever-frequency-native/tools/visual_critic.py | tee visual_critic.log
          grep 'VISUAL GAUNTLET GREEN' visual_critic.log
      - uses: actions/upload-artifact@v4
        with:
          name: Forever-Frequency-Actual-Godot-Gameplay-Screenshot
          path: |
            forever-frequency-native/preview_*.png
            forever-frequency-native/visual_critic_report.json
            visual_critic.log
          if-no-files-found: error
