name: City Zero - ORIGINAL ORANGE Lamborghini true Godot city screenshots
on:
  workflow_dispatch:
  push:
    branches: [forever-frequency-native]
    paths:
      - 'forever-frequency-native/scripts/city_zero.gd'
      - 'forever-frequency-native/tests/approved_lamborghini_in_game_capture.gd'
      - '.github/workflows/city-zero-approved-lamborghini-in-game.yml'
permissions:
  actions: read
  contents: write
concurrency:
  group: cityzero-actual-orange-lamborghini
  cancel-in-progress: true
jobs:
  approved-orange-lamborghini-godot:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forever-frequency-native
          fetch-depth: 0
      - name: Retrieve the SAME original orange CC0 midengine GLB the user selected
        uses: actions/download-artifact@v4
        with:
          run-id: 45336166368
          name: CityZero-CC0-GT4-Car-Research-Visual-Proof
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/approved_original_source
      - name: Validate user-approved GLB and original twin mechanical hinges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,os
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'approved_original_source/assets/curated_rigged/curated_midengine_supercar.glb'
          b=source.read_bytes()
          import hashlib
          assert len(b)==3689788, 'Wrong orange Lamborghini GLB length'
          assert hashlib.sha256(b).hexdigest()=='45cdbfd70dc4e6c64b6bbbe5e24a2107044e2008928ab01c27fa8fbb91a25bd7', 'Wrong Lamborghini: exact approved binary replaced'
          assert b[:4]==b'glTF' and len(b)>3000000, source
          assert struct.unpack_from('<I',b,8)[0]==len(b)
          length,chunk=struct.unpack_from('<I4s',b,12)
          assert chunk==b'JSON'
          metadata=json.loads(b[20:20+length])
          nodes={n.get('name',''):n for n in metadata.get('nodes',[])}
          assert 'DOOR_LEFT_FRONT_HINGE' in nodes and 'DOOR_RIGHT_FRONT_HINGE' in nodes
          assert len(metadata.get('meshes',[]))>=20
          assert 'exotic_supercar__revulse' not in str(source).lower()
          print('APPROVED_ORANGE_LAMBORGHINI_ORIGINAL_GLB_PASS',len(b),'bytes',len(nodes),'nodes')
          PY
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: false
      - name: Install actual Godot software OpenGL display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libegl1 libgles2 mesa-utils
      - name: Stage original approved GLB in isolated copy of real City Zero game scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p approved-isolated/assets/curated_rigged approved-isolated/scenes approved-isolated/scripts approved-isolated/tests
          cp forever-frequency-native/scenes/main.tscn approved-isolated/scenes/
          for script in city_zero game_state mobile_input city_life vehicle_door_controller; do
            cp "forever-frequency-native/scripts/$script.gd" approved-isolated/scripts/
          done
          cp forever-frequency-native/tests/approved_lamborghini_in_game_capture.gd approved-isolated/tests/
          cp "$RUNNER_TEMP/approved_original_source/assets/curated_rigged/curated_midengine_supercar.glb" approved-isolated/assets/curated_rigged/
          cp approved-isolated/assets/curated_rigged/curated_midengine_supercar.glb \
            forever-frequency-native/assets/curated_rigged/curated_midengine_supercar.glb
          echo '45cdbfd70dc4e6c64b6bbbe5e24a2107044e2008928ab01c27fa8fbb91a25bd7  approved-isolated/assets/curated_rigged/curated_midengine_supercar.glb' | sha256sum --check
          cat > approved-isolated/project.godot <<'GODOT'
          config_version=5
          [application]
          config/name="City Zero original game scene - user approved orange Lamborghini"
          run/main_scene="res://scenes/main.tscn"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          GODOT
          echo 'APPROVED_ORANGE_GAME_SCENE_COPIED_UNMODIFIED'
      - name: Fast native Godot class scan of only real gameplay scripts and one original GLB
        shell: bash
        env:
          GODOT_AUDIO_DRIVER: Dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 95s \
            godot --rendering-driver opengl3 --path approved-isolated --editor --import --quit \
              2>&1 | tee /tmp/orange_lamborghini_class_scan.log
          echo 'ORIGINAL_ORANGE_LAMBORGHINI_CLASS_SCAN_COMPLETE'
      - name: Capture actual playable city viewport two original Lamborghini door states
        shell: bash
        env:
          GODOT_AUDIO_DRIVER: Dummy
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set -euo pipefail
          mkdir -p approved-lamborghini-godot-evidence
          export CITYZERO_LAMBORGHINI_SCREENSHOTS="$PWD/approved-lamborghini-godot-evidence"
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 240s \
            godot --rendering-driver opengl3 --path approved-isolated \
              --script res://tests/approved_lamborghini_in_game_capture.gd \
            2>&1 | tee approved-lamborghini-godot-evidence/godot_runtime.log
          grep -q 'CITY_ZERO_APPROVED_LAMBORGHINI_ACTUAL_IN_GAME_SCREENSHOTS_GREEN' approved-lamborghini-godot-evidence/godot_runtime.log
          test -s approved-lamborghini-godot-evidence/LAMBORGHINI_CITY_ZERO_IN_GAME_DOORS_CLOSED.png
          test -s approved-lamborghini-godot-evidence/LAMBORGHINI_CITY_ZERO_IN_GAME_DOORS_OPEN.png
      - name: Publish original GLB and two Godot photos to City Zero branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forever-frequency-native/screenshots
          cp approved-lamborghini-godot-evidence/LAMBORGHINI_CITY_ZERO_IN_GAME_DOORS_CLOSED.png forever-frequency-native/screenshots/
          cp approved-lamborghini-godot-evidence/LAMBORGHINI_CITY_ZERO_IN_GAME_DOORS_OPEN.png forever-frequency-native/screenshots/
          cp approved-lamborghini-godot-evidence/godot_actual_scene_evidence.json forever-frequency-native/screenshots/original_orange_lamborghini_evidence.json
          git config user.name 'City Zero Real Godot Photo Capture'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forever-frequency-native/assets/curated_rigged/curated_midengine_supercar.glb
          git add forever-frequency-native/screenshots/LAMBORGHINI_CITY_ZERO_IN_GAME_DOORS_CLOSED.png
          git add forever-frequency-native/screenshots/LAMBORGHINI_CITY_ZERO_IN_GAME_DOORS_OPEN.png
          git add forever-frequency-native/screenshots/original_orange_lamborghini_evidence.json
          git commit -m "Ship user's orange Lamborghini original GLB and actual City Zero Godot photos [skip ci]"
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin forever-frequency-native
            if git push origin HEAD:forever-frequency-native; then
              echo 'APPROVED_ORANGE_LAMBORGHINI_PUBLISHED_IN_GAME'
              exit 0
            fi
            sleep 2
          done
          echo 'Permanent push failed; photos and GLB are retained in verified Actions artifact'
          exit 1
      - name: Upload exact GLB and TWO genuine Godot in-game frames, even if commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CityZero-Original-Orange-Lamborghini-Actual-Godot-Closed-Open
          path: |
            forever-frequency-native/assets/curated_rigged/curated_midengine_supercar.glb
            approved-lamborghini-godot-evidence/
          if-no-files-found: warn
