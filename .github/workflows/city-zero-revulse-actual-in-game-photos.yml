name: City Zero REVULSE REAL in-game doors closed open
on:
  workflow_dispatch:
  push:
    branches: [forever-frequency-native]
    paths:
      - 'forever-frequency-native/scripts/city_zero.gd'
      - 'forever-frequency-native/tests/revulse_in_game_capture.gd'
      - '.github/workflows/city-zero-revulse-actual-in-game-photos.yml'
permissions:
  contents: write
concurrency:
  group: cityzero-revulse-frame-capture
  cancel-in-progress: true
jobs:
  actual-godot-photos:
    # Use alternate 22.04 pool: 24.04 has a substantial queued workload.
    runs-on: ubuntu-22.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Create original author-made REVULSE in Blender 4.5
        shell: bash
        run: |
          set -euo pipefail
          cd forever-frequency-native
          docker run --rm -e FF_CAR_IDS=exotic_supercar__revulse --entrypoint /home/headless/blender/blender -v "$PWD:$PWD" -w "$PWD" ghcr.io/blenderkit/headless-blender:blender-4.5-stable -b -t 2 --python tools/premium_vehicle_fleet_blender.py 2>&1 | tee revulse_blender_log.txt
          test -s assets/premium_fleet/exotic_supercar__revulse.glb
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('assets/premium_fleet/fleet_metrics.json').read_text())
          assert report['count']==1
          car=report['vehicles'][0]
          assert car['id']=='exotic_supercar__revulse'
          assert car['door_count']==2 and len(car['functional_door_hinges'])==2
          assert Path('assets/premium_fleet/exotic_supercar__revulse.glb').read_bytes()[:4]==b'glTF'
          print('ORIGINAL LAMBORGHINI-INSPIRED REVULSE MODEL READY')
          PY
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: false
      - name: Install real window + OpenGL software renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libegl1 libgles2 mesa-utils
      - name: Validate real REVULSE GLB and hinges without relying on broken .glb.import cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('forever-frequency-native/assets/premium_fleet/exotic_supercar__revulse.glb')
          data=p.read_bytes()
          assert len(data)>14000 and data[:4]==b'glTF'
          magic,version,total=struct.unpack_from('<4sII',data)
          assert magic==b'glTF' and version==2 and total==len(data)
          json_len,kind=struct.unpack_from('<I4s',data,12)
          assert kind==b'JSON'
          metadata=json.loads(data[20:20+json_len])
          names={str(n.get('name','')) for n in metadata.get('nodes',[])}
          hinges=sorted(n for n in names if n.startswith('DOOR_') and n.endswith('_HINGE'))
          assert len(hinges)==2, hinges
          assert len(metadata.get('meshes',[]))>=55, len(metadata.get('meshes',[]))
          print('REVULSE_REAL_GLB_VALIDATED_FOR_GODOT_RUNTIME',p.stat().st_size,hinges)
          PY
      - name: Register City Zero GDScript class names in Godot without depending on GLB import cache
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
          GODOT_AUDIO_DRIVER: Dummy
        run: |
          set -euo pipefail
          # The playable city depends on global class_name registration for
          # ForeverGameState and CityMobileInput. Editor scan is required even
          # though REVULSE itself is loaded directly through GLTFDocument.
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 240s godot --rendering-method gl_compatibility --path forever-frequency-native --editor --import --quit 2>&1 | tee forever-frequency-native/revulse_godot_import.log
          echo 'CITYZERO_CITY_SCRIPTS_SCANNED_FOR_GODOT'
      - name: Take actual Godot game screenshots CLOSED and OPEN
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set -euo pipefail
          mkdir -p "$PWD/revulse-in-game-evidence"
          export CITYZERO_REVULSE_SCREENSHOTS="$PWD/revulse-in-game-evidence"
          xvfb-run -a -s '-screen 0 1920x1080x24' timeout 240s godot --path forever-frequency-native --script res://tests/revulse_in_game_capture.gd 2>&1 | tee revulse-in-game-evidence/godot_capture.log
          grep -q 'CITY_ZERO_REVULSE_TWO_ACTUAL_IN_GAME_SCREENSHOTS_GREEN' revulse-in-game-evidence/godot_capture.log
          test -s revulse-in-game-evidence/REVULSE_CITY_ZERO_IN_GAME_DOORS_CLOSED.png
          test -s revulse-in-game-evidence/REVULSE_CITY_ZERO_IN_GAME_DOORS_OPEN.png
      - name: Publish both VERIFIED real in-game screenshot PNG files in repository
        shell: bash
        run: |
          set -euo pipefail
          folder=forever-frequency-native/screenshots
          mkdir -p "$folder"
          cp revulse-in-game-evidence/REVULSE_CITY_ZERO_IN_GAME_DOORS_CLOSED.png "$folder/"
          cp revulse-in-game-evidence/REVULSE_CITY_ZERO_IN_GAME_DOORS_OPEN.png "$folder/"
          cp revulse-in-game-evidence/godot_actual_scene_evidence.json "$folder/"
          git config user.name "CityZero Visual Capture Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit the ORIGINAL authored GLB as a permanent game asset, not
          # just a temporary screenshot or documentation-only model.
          git add "$folder" forever-frequency-native/assets/premium_fleet/exotic_supercar__revulse.glb
          git commit -m "Ship playable REVULSE model and actual Godot in-game door photos [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin forever-frequency-native
            if git push origin HEAD:forever-frequency-native; then
              echo 'GODOT_REAL_PHOTOS_PUBLISHED_TO_GITHUB'
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Git push unavailable; original screenshots remain in Actions artifact'
              exit 1
            fi
            sleep 3
          done
      - name: Preserve only genuine model and image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: City-Zero-Actual-Game-Lamborghini-REVULSE-Closed-and-Open
          path: |
            revulse-in-game-evidence/
            forever-frequency-native/assets/premium_fleet/exotic_supercar__revulse.glb
            forever-frequency-native/assets/premium_fleet/fleet_metrics.json
            forever-frequency-native/revulse_blender_log.txt
            forever-frequency-native/revulse_godot_import.log
          retention-days: 30
          if-no-files-found: warn
