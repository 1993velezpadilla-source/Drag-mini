name: Kindria V23 release validation
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths:
      - 'my-forever-pet/godot-arcade/**'
      - 'my-forever-pet/tests/compare_kindria_performance.py'
      - 'my-forever-pet/tests/test_compare_kindria_performance.py'
      - '.github/workflows/kindria-v20-release-gauntlet.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kindria-v20-${{ github.ref }}
  cancel-in-progress: false
jobs:
  godot-release-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
        working-directory: my-forever-pet/godot-arcade
    steps:
      - uses: actions/checkout@v4
      - name: Validate performance comparator
        working-directory: my-forever-pet/tests
        run: python3 -m unittest -v test_compare_kindria_performance
      - name: Install Godot 4.6
        working-directory: /tmp
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          sudo install -m 0755 Godot_v4.6-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import and compile project
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import 2>&1 | tee /tmp/kindria-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' /tmp/kindria-import.log; then exit 1; fi
      - name: Run full cinematic gauntlet
        run: |
          set -euo pipefail
          godot --headless --path . --script res://cinematic_gauntlet.gd 2>&1 | tee /tmp/kindria-gauntlet.log
          grep -E 'CINEMATIC_GAUNTLET checks=[0-9]+ failures=0$' /tmp/kindria-gauntlet.log
          grep -E 'KINDRIA_FULL_QUALITY moves=589 frames=7068 audio=1178 runtime_samples=2945' /tmp/kindria-gauntlet.log
          grep -E 'KINDRIA_AUDIO_QUALITY samples=1178 exact_unique=1178' /tmp/kindria-gauntlet.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' /tmp/kindria-gauntlet.log; then exit 1; fi
          test -s /tmp/kindria-quality-report.log
          test -s /tmp/kindria-audio-quality.json
          test -s /tmp/kindria-visual/index.json
      - name: Bake and verify every original PCM stream
        run: |
          set -euo pipefail
          godot --headless --path . --script res://bake_combat_audio.gd 2>&1 | tee /tmp/kindria-audio-pack.log
          grep -E 'KINDRIA_AUDIO_PACK entries=[0-9]+ bytes=[0-9]+ elapsed_ms=[0-9]+ failures=0$' /tmp/kindria-audio-pack.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/kindria-audio-pack.log; then exit 1; fi
          grep -E 'KINDRIA_AUDIO_PACK_BENCH samples=[0-9]+ cold_p50_usec=[0-9]+ cold_p95_usec=[0-9]+ cold_p99_usec=[0-9]+ cold_max_usec=[0-9]+ cache_p95_usec=[0-9]+ cache_peak_entries=[0-9]+' /tmp/kindria-audio-pack.log
      - name: Bake and verify lossless GPU animation strips
        run: |
          set -euo pipefail
          godot --headless --path . --script res://bake_combat_frames.gd 2>&1 | tee /tmp/kindria-frame-pack.log
          grep -E 'KINDRIA_FRAME_PACK moves=[0-9]+ frames=[0-9]+ bytes=[0-9]+ atlas_uploads=[0-9]+ procedural_builds=0 failures=0$' /tmp/kindria-frame-pack.log
          grep -E 'KINDRIA_SECONDARY_PACK textures=[1-9][0-9]* bytes=[1-9][0-9]* failures=0$' /tmp/kindria-frame-pack.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/kindria-frame-pack.log; then exit 1; fi
      - name: Run packed combat CPU benchmark
        run: |
          set -euo pipefail
          godot --headless --path . --script res://combat_performance_benchmark.gd 2>&1 | tee /tmp/kindria-performance-cpu.log
          grep -E 'KINDRIA_PERFORMANCE mode=headless_cpu_submission moves=589 failures=0$' /tmp/kindria-performance-cpu.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/kindria-performance-cpu.log; then exit 1; fi
          test -s /tmp/kindria-performance-cpu.json
      - name: Run desktop rendered combat probe (not Android)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 120 godot --path . --rendering-method gl_compatibility --audio-driver Dummy --resolution 720x720 --script res://combat_performance_benchmark.gd -- --rendered 2>&1 | tee /tmp/kindria-performance-rendered.log
          grep -E 'KINDRIA_PERFORMANCE mode=desktop_rendered moves=589 failures=0$' /tmp/kindria-performance-rendered.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/kindria-performance-rendered.log; then exit 1; fi
          test -s /tmp/kindria-performance-rendered.json
      - name: Compare opt-in particle batching on desktop
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout 120 godot --path . --rendering-method gl_compatibility --audio-driver Dummy --resolution 720x720 --script res://combat_performance_benchmark.gd -- --rendered --particle-batching 2>&1 | tee /tmp/kindria-performance-batched.log
          grep -E 'KINDRIA_PERFORMANCE mode=desktop_rendered moves=589 failures=0$' /tmp/kindria-performance-batched.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/kindria-performance-batched.log; then exit 1; fi
          test -s /tmp/kindria-performance-batched.json
      - name: Validate measured report schema and full stress accounting
        run: |
          set -euo pipefail
          python3 ../tests/compare_kindria_performance.py /tmp/kindria-performance-cpu.json /tmp/kindria-performance-cpu.json > /tmp/kindria-performance-cpu-integrity.json
          python3 ../tests/compare_kindria_performance.py /tmp/kindria-performance-rendered.json /tmp/kindria-performance-rendered.json > /tmp/kindria-performance-rendered-integrity.json
          python3 ../tests/compare_kindria_performance.py /tmp/kindria-performance-batched.json /tmp/kindria-performance-batched.json > /tmp/kindria-performance-batched-integrity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          quality = json.loads(Path('/tmp/kindria-quality-report.log').read_text())
          assert quality['frame_total'] == 7068
          assert quality['audio_total'] == 1178
          assert quality['runtime_samples'] == 2945
          assert len({row['id'] for row in quality['moves']}) == 589
          assert not quality['duplicate_sequences']
          report = json.loads(Path('/tmp/kindria-performance-cpu.json').read_text())
          stress = report['sustained_stress']
          assert stress['casts'] == 192 and stress['expected_waves'] == 576
          assert stress['simulation_frames'] == 900 and stress['slow_simulation_frames'] == 12
          assert stress['peak_active'] == 10 and stress['peak_retired'] >= 6
          assert stress['memory_samples'][-1]['active'] == 0
          assert stress['memory_samples'][-1]['retired'] == 0
          print('KINDRIA_V23_REPORT_INTEGRITY_PASS')
          PY
      - name: Preserve verified animation pack
        uses: actions/upload-artifact@v4
        with:
          name: kindria-combat-frame-pack
          if-no-files-found: error
          path: my-forever-pet/godot-arcade/generated_combat_frames/
      - name: Preserve verified original PCM pack
        uses: actions/upload-artifact@v4
        with:
          name: kindria-combat-audio-pack
          if-no-files-found: error
          retention-days: 14
          path: my-forever-pet/godot-arcade/generated_combat_audio/
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindria-v20-release-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/kindria-import.log
            /tmp/kindria-gauntlet.log
            /tmp/kindria-quality-report.log
            /tmp/kindria-audio-quality.json
            /tmp/kindria-audio-pack.log
            /tmp/kindria-frame-pack.log
            /tmp/kindria-performance-*.json
            /tmp/kindria-performance-*.log
            /tmp/kindria-visual/
