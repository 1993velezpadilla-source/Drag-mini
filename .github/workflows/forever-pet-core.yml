name: Forever Pet core gameplay
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths:
      - 'my-forever-pet/godot-arcade/pet_store.gd'
      - 'my-forever-pet/godot-arcade/research_data.gd'
      - 'my-forever-pet/godot-arcade/sanctuary_field.gd'
      - 'my-forever-pet/godot-arcade/research_trial.gd'
      - 'my-forever-pet/godot-arcade/field_hunt_rules.gd'
      - 'my-forever-pet/tests/**'
      - '.github/workflows/forever-pet-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Test production simulation independent of art
        run: |
          set -euo pipefail
          mkdir -p /tmp/pet-core
          printf 'config_version=5\n[application]\nconfig/name="Forever Pet core tests"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > /tmp/pet-core/project.godot
          cp my-forever-pet/godot-arcade/field_hunt_rules.gd my-forever-pet/godot-arcade/pet_store.gd my-forever-pet/godot-arcade/research_data.gd my-forever-pet/tests/core_gameplay.gd /tmp/pet-core/
          timeout 60 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path /tmp/pet-core --script res://core_gameplay.gd -- --home-test 2>&1 | tee /tmp/pet-core.log
          grep -F FOREVER_PET_CORE_PASS /tmp/pet-core.log
          ! grep -E 'CORE_FAIL|SCRIPT ERROR|Parse Error' /tmp/pet-core.log
      - name: Traverse all nine sanctuaries in production movement code
        run: |
          set -euo pipefail
          cp my-forever-pet/godot-arcade/sanctuary_field.gd my-forever-pet/tests/sanctuary_navigation.gd /tmp/pet-core/
          timeout 60 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path /tmp/pet-core --script res://sanctuary_navigation.gd 2>&1 | tee /tmp/sanctuary-nav.log
          grep -F 'FOREVER_SANCTUARY_NAV_PASS 27' /tmp/sanctuary-nav.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/sanctuary-nav.log
      - name: Run actual research trial controls
        run: |
          set -euo pipefail
          cp my-forever-pet/godot-arcade/research_trial.gd my-forever-pet/tests/research_trials.gd /tmp/pet-core/
          timeout 60 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path /tmp/pet-core --script res://research_trials.gd 2>&1 | tee /tmp/research-trials.log
          grep -F 'FOREVER_RESEARCH_TRIAL_PASS 9' /tmp/research-trials.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/research-trials.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-gameplay-report
          path: |
            /tmp/pet-core.log
            /tmp/sanctuary-nav.log
            /tmp/research-trials.log
