name: City Zero NFSU2 browser gauntlet

on:
  workflow_dispatch:
  push:
    branches: [forever-frequency-native]
    paths:
      - tools/nfsu2_browser_probe.mjs
      - .github/workflows/nfsu2-browser-probe.yml

permissions:
  contents: read

jobs:
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Find Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            sudo apt-get update -qq
            sudo apt-get install -y chromium
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          fi
      - name: Browser self-test (offline)
        run: |
          node --check tools/nfsu2_browser_probe.mjs
          node tools/nfsu2_browser_probe.mjs --self-test --click-play --out=artifacts/smoke
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('artifacts/smoke/report.json').read_text())
          assert result['status'] == 'captured', result
          assert result['landing']['title'] == 'CityZeroSmoke', result
          assert result['clicked_play'] is True, result
          assert result['after_play']['canvases'][0]['width'] == 640, result
          assert Path('artifacts/smoke/landing.png').stat().st_size > 1000
          assert Path('artifacts/smoke/after_play.png').stat().st_size > 1000
          PY
      - name: Inspect public NFSU2 modded web game
        continue-on-error: true
        run: |
          node tools/nfsu2_browser_probe.mjs \
            --url=https://nfsu2mod.xyz/ \
            --out=artifacts/nfsu2-public --click-play --wait=15000
      - name: REA static reconnaissance of public NFSU2 browser source
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          mkdir -p artifacts/rea
          git clone --quiet --depth=1 https://github.com/th0mk/nfsu2-web.git /tmp/nfsu2-web-public
          set +e
          npx --yes rea-agents@latest analyze-javascript-application /tmp/nfsu2-web-public/web/src --json \
            > artifacts/rea/frontend-analysis.json 2> artifacts/rea/rea-errors.txt
          code=$?
          printf '%s\n' "$code" > artifacts/rea/exit-code.txt
          echo "REA CLI exit code: $code"
          if [ -s artifacts/rea/rea-errors.txt ]; then head -n 25 artifacts/rea/rea-errors.txt; fi
          exit "$code"
      - name: Save screenshots and technical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cityzero-nfsu2-browser-evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
