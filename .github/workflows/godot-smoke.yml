name: Godot smoke check
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import resources
        run: godot --headless --path . --editor --import --quit
      - name: Verify scene and sprites
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/dragmini-smoke.log
          grep -Fq 'DRAG MINI SMOKE: PASS' /tmp/dragmini-smoke.log
      - name: Verify independent Android GAS+SHIFT touches
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/touch_smoke.gd 2>&1 | tee /tmp/dragmini-touch.log
          grep -Fq 'DRAG MINI TOUCH PASS' /tmp/dragmini-touch.log
      - name: Verify official owner images, interactive menu and shift-light feedback
        run: |
          set -o pipefail
          timeout 60s godot --headless --path . --script res://tests/official_assets_smoke.gd 2>&1 | tee /tmp/dragmini-official-art.log
          grep -Fq 'DRAG MINI OFFICIAL ART + SHIFT PASS' /tmp/dragmini-official-art.log
      - name: Render real OpenGL menu and track screenshots, reject grey frames
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 90s godot --path . --rendering-method gl_compatibility --script res://tests/visual_menu_smoke.gd 2>&1 | tee /tmp/dragmini-visual.log
          grep -Fq 'DRAG MINI VISUAL PASS' /tmp/dragmini-visual.log
      - name: Upload actual rendered menu and track screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DragMini-V0.6-Real-Render-Screenshots
          path: build/visual-*.png
          if-no-files-found: warn
