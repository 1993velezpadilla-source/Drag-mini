name: Godot smoke check
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import resources
        run: godot --headless --path . --editor --import --quit
      - name: Verify scene and sprites
        run: godot --headless --path . --script res://tests/smoke.gd
