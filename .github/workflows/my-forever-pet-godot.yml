name: Forever Pet Godot arcade prototype
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths: ['my-forever-pet/godot-arcade/**', '.github/workflows/my-forever-pet-godot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot editor
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and run deterministic scene smoke
        run: |
          set -o pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path my-forever-pet/godot-arcade --editor --import --quit
          timeout 60 "$G" --headless --path my-forever-pet/godot-arcade -- --test 2>&1 | tee /tmp/godot-smoke.log
          grep -F PET_DASH_3D_SMOKE_PASS /tmp/godot-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/godot-smoke.log
