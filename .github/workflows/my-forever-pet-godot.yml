name: Forever Pet Godot arcade prototype
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths: ['my-forever-pet/godot-arcade/**', '.github/workflows/my-forever-pet-godot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot editor
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Fail fast on GDScript parser errors
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path my-forever-pet/godot-arcade --check-only --script res://runner.gd 2>&1 | tee /tmp/dash-parse.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/dash-parse.log
      - name: Install Blender and virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y blender xvfb python3-numpy python3-pil
      - name: Export original GLB game meshes
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 --python-expr "import numpy; print(numpy.__version__)"
          blender -b -t 4 --python-exit-code 1 -P my-forever-pet/godot-arcade/blender_assets.py -- my-forever-pet/godot-arcade/assets
          cat my-forever-pet/godot-arcade/assets/mesh-metrics.json
          python3 - <<'PY'
          import pathlib, struct
          root=pathlib.Path("my-forever-pet/godot-arcade/assets")
          for name in ("bridge","arch","island","mosskit","foot","crate","barrier","coin","snack","magnet","shield","double","boost","cart","tall","low_bar","airship","rainbow"):
              p=root/(name+".glb")
              data=p.read_bytes()
              assert len(data)>1000 and struct.unpack("<4sII",data[:12])==(b"glTF",2,len(data)),name
              print("GLB_VALID",name,len(data))
          PY
      - name: Bake panoramic cloudscape
        run: python3 my-forever-pet/godot-arcade/sky_panorama.py my-forever-pet/godot-arcade/assets/sky-panorama.png
      - name: Bake original runner music
        run: python3 my-forever-pet/godot-arcade/bake_music.py my-forever-pet/godot-arcade/assets/skyway-music.wav
      - name: Import and run deterministic scene smoke
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path my-forever-pet/godot-arcade --editor --import --quit
          timeout 60 "$G" --headless --path my-forever-pet/godot-arcade -- --test 2>&1 | tee /tmp/godot-smoke.log
          grep -F PET_DASH_3D_SMOKE_PASS /tmp/godot-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/godot-smoke.log
      - name: Long-run procedural physics and object recycling
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          timeout 120 "$G" --headless --fixed-fps 60 --path my-forever-pet/godot-arcade -- --soak 2>&1 | tee /tmp/dash-soak.log
          grep -F PET_DASH_SOAK_PASS /tmp/dash-soak.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/dash-soak.log
          cat /tmp/pet-dash-soak.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Export isolated Android ARM64 test APK
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable" "$HOME/.config/godot" "$HOME/.android"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/android_*.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          keytool -genkeypair -keystore "$HOME/.android/petdash-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pet Dash Debug"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/petdash-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/petdash-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --verbose --headless --path my-forever-pet/godot-arcade --export-debug "Android Lab" /tmp/Pet-Dash-3D-Lab-arm64.apk
          test -s /tmp/Pet-Dash-3D-Lab-arm64.apk
          "$SDK/build-tools/34.0.0/apksigner" verify /tmp/Pet-Dash-3D-Lab-arm64.apk
          "$SDK/build-tools/34.0.0/aapt" dump badging /tmp/Pet-Dash-3D-Lab-arm64.apk | grep -F "org.myforeverpet.dashlab"
          unzip -l /tmp/Pet-Dash-3D-Lab-arm64.apk | grep -F lib/arm64-v8a/libgodot_android.so
      - uses: actions/upload-artifact@v4
        with:
          name: Pet-Dash-3D-Lab-Android-ARM64-debug
          path: /tmp/Pet-Dash-3D-Lab-arm64.apk
          if-no-files-found: error
      - name: Capture actual 3D viewport
        id: visual
        continue-on-error: true
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 720x1280x24" timeout 180 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --path my-forever-pet/godot-arcade --rendering-method gl_compatibility --audio-driver Dummy --resolution 540x960 -- --capture
          test -s /tmp/pet-dash-review.png
          test -s /tmp/pet-dash-render-metrics.json
          cat /tmp/pet-dash-render-metrics.json
          python3 my-forever-pet/godot-arcade/review_frame.py /tmp/pet-dash-review.png /tmp/pet-dash-visual-metrics.json
          cat /tmp/pet-dash-visual-metrics.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.visual.outcome != 'skipped'
        with:
          name: Pet-Dash-3D-real-game-review
          path: |
            /tmp/pet-dash-review.png
            /tmp/pet-dash-render-metrics.json
            /tmp/pet-dash-visual-metrics.json
            /tmp/pet-dash-soak.json
            my-forever-pet/godot-arcade/assets/*.glb
            my-forever-pet/godot-arcade/assets/mesh-metrics.json
            my-forever-pet/godot-arcade/assets/sky-panorama.png
            my-forever-pet/godot-arcade/assets/skyway-music.wav
          if-no-files-found: error
      - name: Require visual verification independently of APK packaging
        if: always()
        run: test "${{ steps.visual.outcome }}" = success
