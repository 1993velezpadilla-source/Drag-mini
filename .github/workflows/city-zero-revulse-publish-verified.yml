name: City Zero REVULSE publish verified Godot screenshots and GLB
on:
  workflow_dispatch:
  push:
    branches: [forever-frequency-native]
    paths:
      - '.github/workflows/city-zero-revulse-publish-verified.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish-authentic-captured-artifact:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forever-frequency-native
      - name: Download previous verified actual Godot screenshot artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 45352235109
          name: City-Zero-Actual-Game-Lamborghini-REVULSE-Closed-and-Open
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/revulse_approved
      - name: Verify model binary, actual screenshot evidence, and PNG file headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, struct
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'revulse_approved'
          evidence=root/'revulse-in-game-evidence'
          glb=root/'forever-frequency-native/assets/premium_fleet/exotic_supercar__revulse.glb'
          assert glb.is_file(),glb
          raw=glb.read_bytes()
          assert len(raw)>14000 and raw[:4]==b'glTF'
          length,=struct.unpack_from('<I',raw,8)
          assert length==len(raw)
          metadata=json.loads((evidence/'godot_actual_scene_evidence.json').read_text())
          assert metadata['real_glb'] and metadata['in_city_world']
          assert len(metadata['hinges'])==2
          assert metadata['changed_grid_pixels']>=180
          for state in ('CLOSED','OPEN'):
              p=evidence/f'REVULSE_CITY_ZERO_IN_GAME_DOORS_{state}.png'
              assert p.is_file(),p
              assert p.stat().st_size>20000
              assert p.read_bytes()[:8]==bytes.fromhex('89504e470d0a1a0a')
          print('REVULSE_VERIFIED_BINARY_GODOT_FRAMES_VALID')
          PY
      - name: Permanently commit original REVULSE GLB and two REAL in-game photos
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/revulse_approved"
          mkdir -p forever-frequency-native/assets/premium_fleet
          mkdir -p forever-frequency-native/screenshots
          cp "$source_dir/forever-frequency-native/assets/premium_fleet/exotic_supercar__revulse.glb" forever-frequency-native/assets/premium_fleet/
          cp "$source_dir/revulse-in-game-evidence/REVULSE_CITY_ZERO_IN_GAME_DOORS_CLOSED.png" forever-frequency-native/screenshots/
          cp "$source_dir/revulse-in-game-evidence/REVULSE_CITY_ZERO_IN_GAME_DOORS_OPEN.png" forever-frequency-native/screenshots/
          cp "$source_dir/revulse-in-game-evidence/godot_actual_scene_evidence.json" forever-frequency-native/screenshots/
          git config user.name "City Zero Verified Rendering"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forever-frequency-native/assets/premium_fleet/exotic_supercar__revulse.glb forever-frequency-native/screenshots/
          if git diff --cached --quiet; then
            echo 'REVULSE_SCREENSHOTS_AND_MODEL_ALREADY_PUBLISHED'
            exit 0
          fi
          git commit -m "Add original playable REVULSE GLB and real Godot closed-open in-game screenshots [skip ci]"
          git pull --rebase --autostash origin forever-frequency-native
          git push origin HEAD:forever-frequency-native
          echo 'REVULSE_VERIFIED_GODOT_CAPTURE_PUBLISHED_IN_GAME'
