name: Drag Mini editable Godot source V0.5
on:
  push:
    branches:
      - feature/v05-official-menu-track-shift-lamp
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'project.godot'
      - '.github/workflows/source-export.yml'
permissions:
  contents: read
jobs:
  godot-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify official media are the original uploaded files
        run: |
          test "$(sha256sum assets/ui/official_main_menu.jpg | cut -d' ' -f1)" = "927fd4a3ff7bd29408454e767c580512500d30b77c11fc97e172c2ea96529060"
          test "$(sha256sum assets/tracks/official_drag_strip.jpg | cut -d' ' -f1)" = "6652dc1f7852f43c4a58d82ae29503d80eb0a492f221deb2078a588bf6500ac7"
      - name: Create Godot source ZIP
        run: git archive HEAD --format zip --output DragMini-v0.5-Godot-Project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DragMini-v0.5-Editable-Godot-Source
          path: DragMini-v0.5-Godot-Project.zip
          retention-days: 14
