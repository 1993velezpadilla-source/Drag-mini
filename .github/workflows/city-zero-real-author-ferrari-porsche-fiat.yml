name: City Zero REAL Ferrari F40 Porsche 911 Fiat Punto Blender artists
on:
  workflow_dispatch:
  push:
    branches: [forever-frequency-native]
    paths:
      - '.github/workflows/city-zero-real-author-ferrari-porsche-fiat.yml'
      - 'forever-frequency-native/tools/import_artist_ccby_real_car_fleet.py'
      - 'forever-frequency-native/tests/real_artist_fleet_godot_capture.gd'
concurrency:
  group: cityzero-real-original-f40-porsche-punto-source
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  authentic-original-artist-blender:
    runs-on: ubuntu-22.04
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - name: Download REAL artist-authored licensed GLBs (not NFS game rips or AI photos)
        shell: bash
        run: |
          set -euo pipefail
          target=forever-frequency-native/assets/original_artist_ccby_sources
          mkdir -p "$target"
          base=https://github.com/sceneview/sceneview/releases/download/assets-v1
          while IFS=' ' read -r checksum filename; do
            curl -fL --retry 4 --connect-timeout 30 --max-time 300 -o "$target/$filename" "$base/$filename"
            test -s "$target/$filename"
            test "$(head -c 4 "$target/$filename")" = glTF
            test "$(sha256sum "$target/$filename" | cut -d' ' -f1)" = "$checksum"
          done <<'PINNED_ORIGINAL_ARTIST_GLBS'
          a1ec281f1c219c049ecd07e4ef20c69d26c233b6270614743ca015a7f5713674 ferrari_f40.glb
          e1d7de07dda7d42aa9d87da33af4d4b05ed344e9c0222d571dce19e3658436ac porsche_911.glb
          903a94662e6a170fdf1a1323b7ebc2cbbda9185623ec9e814cfc91437902173f fiat_punto.glb
          PINNED_ORIGINAL_ARTIST_GLBS
          cat > "$target/AUTHORSHIP_AND_LICENSE_NOTICE.txt" <<'NOTICE'
          These GLBs originate from the open-license models redistributed by
          https://github.com/sceneview/sceneview/releases/tag/assets-v1
          Each model is separately licensed by its own artist under CC BY 4.0,
          NOT under SceneView's Apache 2.0 repository license.
          Ferrari F40: Black Snow, source
          https://sketchfab.com/3d-models/ferrari-f40-52a66c41cfcd4f999fb1b1c49bf24d70
          Porsche 911 930 Turbo: Karol Miklas, source
          https://sketchfab.com/3d-models/free-1975-porsche-911-930-turbo-8568d9d14a994b9cae59499f0dbed21e
          Fiat Punto GT: Karol Miklas, source
          https://sketchfab.com/3d-models/free-1995-fiat-punto-gt-48db6facb4b64e99b60f36b8c01185e1
          License: https://creativecommons.org/licenses/by/4.0/
          Model names/trademarks not cleared for commercial car-brand promotion.
          This is a source geometry and Blender import proof only, not complete gameplay
          vehicle setup, moving doors, trunk, hood, tuned car systems, or mobile approval.
          NOTICE
          python3 -m py_compile forever-frequency-native/tools/import_artist_ccby_real_car_fleet.py
      - name: Pull official native Blender 4.5 LTS headless renderer
        run: docker pull ghcr.io/blenderkit/headless-blender:blender-4.5-stable
      - name: Real Blender imports, editable masters and native Cycles source textures
        shell: bash
        run: |
          set -euo pipefail
          cd forever-frequency-native
          timeout 1600s docker run --rm --entrypoint /home/headless/blender/blender \
            -v "$PWD:$PWD" -w "$PWD" \
            ghcr.io/blenderkit/headless-blender:blender-4.5-stable \
            -b -t 2 --python tools/import_artist_ccby_real_car_fleet.py \
            2>&1 | tee REAL_FERRARI_PORSCHE_FIAT_BLENDER.log
          grep -q 'THREE REAL ARTIST-AUTHORED CC-BY BLENDER CARS FIVE VIEWS EACH GREEN' REAL_FERRARI_PORSCHE_FIAT_BLENDER.log
      - name: Fail closed if a vehicle lacks REAL geometry, edited Blender or original-source photos
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('forever-frequency-native')
          out=root/'assets/licensed_ccby_car_fleet'
          proof=root/'artist_ccby_real_car_blender_proof'
          data=json.loads((proof/'licensed_artist_fleet_report.json').read_text())
          assert len(data)==3
          assert {item['id'] for item in data}=={'ferrari_f40','porsche_911','fiat_punto'}
          assert len(list(proof.glob('*.png')))==15
          for item in data:
              ident=item['id']
              assert item['blender_source_triangles']>1500
              assert item['source_material_count']>=1
              assert len(item['native_blender_photos'])==5
              assert not item['game_ready'] and not item['doors_hinges_approved']
              assert (out/item['editable_blend']).stat().st_size>100000
              assert (out/item['blender_exported_glb']).stat().st_size>300000
              for photo in item['native_blender_photos']:
                  assert (proof/photo).stat().st_size>16000, photo
          print('REAL ARTIST-AUTHORED THREE CAR ORIGINAL BLENDER SOURCES GREEN (STILL NEED GODOT QA)')
          PY
      - name: Publish ACTUAL Blender editable files, THREE GLBs and FIFTEEN real screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CityZero-REAL-FerrariF40-Porsche911-FiatPunto-Artist-Blender-GLB-Fifteen-Photos
          retention-days: 90
          path: |
            forever-frequency-native/assets/licensed_ccby_car_fleet/*
            forever-frequency-native/assets/original_artist_ccby_sources/AUTHORSHIP_AND_LICENSE_NOTICE.txt
            forever-frequency-native/artist_ccby_real_car_blender_proof/*
            forever-frequency-native/REAL_FERRARI_PORSCHE_FIAT_BLENDER.log
          if-no-files-found: warn

  genuine-godot-glb-showroom:
    needs: authentic-original-artist-blender
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Download artist-authored Blender exported GLBs, not placeholders
        uses: actions/download-artifact@v4
        with:
          name: CityZero-REAL-FerrariF40-Porsche911-FiatPunto-Artist-Blender-GLB-Fifteen-Photos
          path: genuine-source
      - name: Prepare isolated Godot engine import validation for real cars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p isolated/assets/licensed_ccby_car_fleet isolated/tests
          for name in ferrari_f40 porsche_911 fiat_punto; do
            file="genuine-source/assets/licensed_ccby_car_fleet/"$name"_blender_import.glb"
            test -s "$file"
            test "$(head -c 4 "$file")" = glTF
            cp "$file" isolated/assets/licensed_ccby_car_fleet/
          done
          cp forever-frequency-native/tests/real_artist_fleet_godot_capture.gd isolated/tests/
          cat > isolated/project.godot <<'GODOT'
          config_version=5
          [application]
          config/name="City Zero artist CC BY car showroom Godot import QA"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=800
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          GODOT
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.4.1-stable
          export-templates: false
      - name: Install real offscreen window OpenGL libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri libegl1 mesa-utils
      - name: Godot engine imports the three REAL Blender GLB assets
        shell: bash
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 xvfb-run -a -s '-screen 0 1600x900x24' timeout 190s godot --rendering-driver opengl3 --rendering-method gl_compatibility --path isolated --editor --import --quit 2>&1 | tee ARTIST_CARS_GODOT_IMPORT.log
          for name in ferrari_f40 porsche_911 fiat_punto; do
            test -s "isolated/assets/licensed_ccby_car_fleet/"$name"_blender_import.glb.import"
            grep -q '\[remap\]' "isolated/assets/licensed_ccby_car_fleet/"$name"_blender_import.glb.import"
          done
      - name: Six screenshot real Godot car mesh versus hidden-mesh pixel controls
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          set -euo pipefail
          mkdir -p "$PWD/artist-3-car-godot-evidence"
          export CITYZERO_ARTIST_GODOT_PHOTOS="$PWD/artist-3-car-godot-evidence"
          xvfb-run -a -s '-screen 0 1600x900x24' timeout 230s godot --path isolated --script res://tests/real_artist_fleet_godot_capture.gd 2>&1 | tee artist-3-car-godot-evidence/GODOT_ACTUAL_IMAGES.log
          grep -q 'CITYZERO_THREE_ARTIST_CARS_SIX_ACTUAL_GODOT_IMAGES_GREEN' artist-3-car-godot-evidence/GODOT_ACTUAL_IMAGES.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=Path("artist-3-car-godot-evidence")
          report=json.loads((d/"artist_fleet_REAL_GODOT_report.json").read_text())
          assert report['artist_car_count']==3
          assert report['real_native_godot_photos']==6
          assert len(list(d.glob('*.png')))==6
          assert {x['id'] for x in report['vehicles']}=={'ferrari_f40','porsche_911','fiat_punto'}
          for car in report['vehicles']:
              assert car['real_godot_triangles']>1500
              assert not car['gameplay_ready']
              assert len(car['photographs'])==2
              assert all(x['actual_mesh_sampled_pixels']>120 for x in car['photographs'])
              assert all(Path(x['png']).stat().st_size>20000 for x in car['photographs'])
          print('THREE AUTHENTIC ORIGINAL ARTIST VEHICLES, SIX REAL GODOT CAPTURES GREEN')
          PY
      - name: Upload six real non-AI Godot screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CityZero-REAL-F40-Porsche911-FiatPunto-SIX-Godot-Engine-Photos
          retention-days: 90
          path: |
            artist-3-car-godot-evidence/
            ARTIST_CARS_GODOT_IMPORT.log
          if-no-files-found: warn
