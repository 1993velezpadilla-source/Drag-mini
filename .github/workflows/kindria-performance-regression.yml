name: Kindria performance regression comparator
on:
  push:
    branches: [feature/my-forever-pet-paradise]
    paths:
      - 'my-forever-pet/tests/compare_kindria_performance.py'
      - 'my-forever-pet/tests/test_compare_kindria_performance.py'
      - '.github/workflows/kindria-performance-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test comparator
        working-directory: my-forever-pet/tests
        run: python3 -m unittest -v test_compare_kindria_performance
