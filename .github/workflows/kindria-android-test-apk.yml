name: Kindria Android test APK
on:
  push:
    branches: [feature/kindria-v27-1-validation]
    paths: ['.github/workflows/kindria-android-test-apk.yml']
  workflow_dispatch:
concurrency:
  group: kindria-android-test-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test combat pack verifier (loose, PCK and corrupt payloads)
        run: python3 my-forever-pet/godot-arcade/test_apk_combat_packs.py
      - name: Download pinned Godot editor
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Fail fast on GDScript parser errors
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path my-forever-pet/godot-arcade --check-only --script res://runner.gd 2>&1 | tee /tmp/dash-parse.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/dash-parse.log
          for script in pet_store.gd hub.gd pet_arcade.gd live_pet_stage.gd research_map.gd research_trial.gd sanctuary_field.gd field_hunt_rules.gd wild_field.gd dungeon_rules.gd dungeon_view.gd; do
            "$G" --headless --path my-forever-pet/godot-arcade --check-only --script "res://$script" 2>&1 | tee "/tmp/$script.log"
            ! grep -E "SCRIPT ERROR|Parse Error" "/tmp/$script.log"
          done
      - name: Install Blender and virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y blender xvfb python3-numpy python3-pil
      - name: Export original GLB game meshes
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 --python-expr "import numpy; print(numpy.__version__)"
          blender -b -t 4 --python-exit-code 1 -P my-forever-pet/godot-arcade/blender_assets.py -- my-forever-pet/godot-arcade/assets
          cat my-forever-pet/godot-arcade/assets/mesh-metrics.json
          python3 - <<'PY'
          import pathlib, struct
          root=pathlib.Path("my-forever-pet/godot-arcade/assets")
          for name in ("bridge","arch","island","mosskit","foot","crate","barrier","coin","snack","magnet","shield","double","boost","cart","tall","low_bar","airship","rainbow","time_orb","spring","sky_ring","gem","rescue","smash","surf_board","surf_pickup","portal","crystal_island","moon_island","palace","cloud_bank","royal_gate","garden_island","windmill_island","courier","roller","story_card","reward_spark","treasure_gate"):
              p=root/(name+".glb")
              data=p.read_bytes()
              assert len(data)>1000 and struct.unpack("<4sII",data[:12])==(b"glTF",2,len(data)),name
              print("GLB_VALID",name,len(data))
          PY
      - name: Audit every game GLB independently of exporter
        run: python3 my-forever-pet/godot-arcade/audit_catalog.py my-forever-pet/godot-arcade/assets
      - name: Bake panoramic cloudscape
        run: python3 my-forever-pet/godot-arcade/sky_panorama.py my-forever-pet/godot-arcade/assets/sky-panorama.png
      - name: Bake original runner music
        run: python3 my-forever-pet/godot-arcade/bake_music.py my-forever-pet/godot-arcade/assets/skyway-music.wav
      - name: Render original Forever Pet home and species assets
        run: |
          set -euo pipefail
          blender -b -t 4 --python-exit-code 1 -P my-forever-pet/art/render_home.py -- my-forever-pet/godot-arcade/assets
          blender -b -t 4 --python-exit-code 1 -P my-forever-pet/art/render_pets.py -- my-forever-pet/godot-arcade/assets
          for i in $(seq 0 23); do test -s "my-forever-pet/godot-arcade/assets/pet_$i.png"; done
          for field in 0 1 2; do for stage in 1 2; do test -s "my-forever-pet/godot-arcade/assets/growth_${field}_${stage}.png"; done; done
          test -s my-forever-pet/godot-arcade/assets/home_day.jpg
          blender -b -t 4 --python-exit-code 1 -P my-forever-pet/art/render_premium_sets.py -- my-forever-pet/godot-arcade/assets
          for room in kitchen bathroom bedroom toy garden lab; do test -s "my-forever-pet/godot-arcade/assets/room_$room.jpg"; test -s "my-forever-pet/godot-arcade/assets/rooms/room_$room.glb"; done
          blender -b -t 4 --python-exit-code 1 -P my-forever-pet/art/render_dash_creatures.py -- my-forever-pet/godot-arcade/assets
          for i in $(seq -w 1 27); do test -s "my-forever-pet/godot-arcade/assets/creatures/species_$i.glb"; done
          for i in $(seq 0 27); do test -s "my-forever-pet/godot-arcade/assets/pet_$i.png"; test -s "my-forever-pet/godot-arcade/assets/pet_sleep_$i.png"; done
          for game in star flappy cloud find; do test -s "my-forever-pet/godot-arcade/assets/arcade_$game.jpg"; done
          test -s my-forever-pet/godot-arcade/assets/room_layout.json
          python3 my-forever-pet/godot-arcade/audit_visual_assets.py my-forever-pet/godot-arcade/assets
          blender -b -t 4 --python-exit-code 1 -P my-forever-pet/art/render_wardrobe.py -- my-forever-pet/godot-arcade/assets
          for i in $(seq 0 7); do test -s "my-forever-pet/godot-arcade/assets/clothes_$i.png"; test -s "my-forever-pet/godot-arcade/assets/wardrobe/clothes_$i.glb"; done
          for i in $(seq 0 5); do test -s "my-forever-pet/godot-arcade/assets/item_$i.png"; test -s "my-forever-pet/godot-arcade/assets/wardrobe/item_$i.glb"; done
      - name: Bake existing licensed PixelFX animations
        run: bash my-forever-pet/art/import_pixelfx.sh my-forever-pet/godot-arcade/assets/pet_fx
      - name: Import and run deterministic scene smoke
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path my-forever-pet/godot-arcade --editor --import --quit
          timeout 60 "$G" --headless --path my-forever-pet/godot-arcade -- --test 2>&1 | tee /tmp/godot-smoke.log
          grep -F PET_DASH_3D_SMOKE_PASS /tmp/godot-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/godot-smoke.log
      - name: Validate Kindria combat on the actual Android export engine
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --version | tee /tmp/kindria-apk-engine.log
          timeout 600 "$G" --headless --path my-forever-pet/godot-arcade --script res://cinematic_gauntlet.gd 2>&1 | tee /tmp/kindria-apk-gauntlet.log
          grep -E 'CINEMATIC_GAUNTLET checks=[0-9]+ failures=0$' /tmp/kindria-apk-gauntlet.log
          grep -E 'KINDRIA_FULL_QUALITY moves=589 frames=7068 audio=1178 runtime_samples=2945' /tmp/kindria-apk-gauntlet.log
          grep -E 'KINDRIA_AUDIO_QUALITY samples=1178 exact_unique=1178' /tmp/kindria-apk-gauntlet.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' /tmp/kindria-apk-gauntlet.log
      - name: Verify reusable mood, part and imported effect frames
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path my-forever-pet/godot-arcade --script res://test_pet_animation_library.gd 2>&1 | tee /tmp/pet-animation-library.log
          grep -F PET_ANIMATION_LIBRARY_PASS /tmp/pet-animation-library.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/pet-animation-library.log
      - name: Verify integrated Forever Pet hub and wallet
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          timeout 60 "$G" --headless --path my-forever-pet/godot-arcade -- --home-test 2>&1 | tee /tmp/pet-home.log
          grep -F FOREVER_PET_HUB_PASS /tmp/pet-home.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/pet-home.log
      - name: Verify actual touch-style scrolling and tap cancellation
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 720x1280x24" timeout 60 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --path my-forever-pet/godot-arcade --rendering-method gl_compatibility --audio-driver Dummy --resolution 540x960 -- --home-touch-test 2>&1 | tee /tmp/pet-touch.log
          grep -F "FOREVER_PET_TOUCH_PASS" /tmp/pet-touch.log
          ! grep -E "SCRIPT ERROR|Parse Error" /tmp/pet-touch.log
      - name: Prove lane-only play loses the opening action gate
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          timeout 45 "$G" --headless --fixed-fps 60 --path my-forever-pet/godot-arcade -- --lane-only 2>&1 | tee /tmp/dash-lane-only.log
          grep -F PET_DASH_LANE_ONLY_FAILS /tmp/dash-lane-only.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/dash-lane-only.log
      - name: Verify expert route without power-ups across seeds
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          for seed in 7319 17041; do
            timeout 120 "$G" --headless --fixed-fps 60 --path my-forever-pet/godot-arcade -- --unassisted --seed=$seed 2>&1 | tee /tmp/dash-unassisted-$seed.log
            grep -F PET_DASH_UNASSISTED_PASS /tmp/dash-unassisted-$seed.log
            ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/dash-unassisted-$seed.log
          done
      - name: Long-run procedural physics and object recycling
        run: |
          set -euo pipefail
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          timeout 120 "$G" --headless --fixed-fps 60 --path my-forever-pet/godot-arcade -- --soak 2>&1 | tee /tmp/dash-soak.log
          grep -F PET_DASH_SOAK_PASS /tmp/dash-soak.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/dash-soak.log
          cat /tmp/pet-dash-soak.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies across Android builds
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Export isolated Android ARM64 test APK
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.2.8568313'
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable" "$HOME/.config/godot" "$HOME/.android"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip -d /tmp/godot-templates
          mkdir -p my-forever-pet/godot-arcade/android/build
          unzip -q /tmp/godot-templates/templates/android_source.zip -d my-forever-pet/godot-arcade/android/build
          python3 my-forever-pet/godot-arcade/android_wallpaper/install.py my-forever-pet/godot-arcade/android/build
          touch my-forever-pet/godot-arcade/android/.gdignore
          printf '4.4.1.stable' > my-forever-pet/godot-arcade/android/.build_version
          chmod +x my-forever-pet/godot-arcade/android/build/gradlew
          cp /tmp/godot-templates/templates/android_*.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          keytool -genkeypair -keystore "$HOME/.android/petdash-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Pet Dash Debug"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/petdash-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/petdash-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          G=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$G" --headless --path my-forever-pet/godot-arcade --script res://bake_combat_audio.gd 2>&1 | tee /tmp/kindria-apk-audio-pack.log
          grep -E 'KINDRIA_AUDIO_PACK entries=[1-9][0-9]* bytes=[1-9][0-9]* elapsed_ms=[0-9]+ failures=0$' /tmp/kindria-apk-audio-pack.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/kindria-apk-audio-pack.log
          "$G" --headless --path my-forever-pet/godot-arcade --script res://bake_combat_frames.gd 2>&1 | tee /tmp/kindria-apk-frame-pack.log
          grep -E 'KINDRIA_FRAME_PACK .*procedural_builds=0 failures=0$' /tmp/kindria-apk-frame-pack.log
          grep -E 'KINDRIA_SECONDARY_PACK textures=[1-9][0-9]* bytes=[1-9][0-9]* failures=0$' /tmp/kindria-apk-frame-pack.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Compile Error' /tmp/kindria-apk-frame-pack.log
          for file in generated_combat_audio/index.json generated_combat_audio/audio.pcm generated_combat_frames/index.json generated_combat_frames/frames.bin generated_combat_frames/particles.json generated_combat_frames/particles.bin; do
            test -s "my-forever-pet/godot-arcade/$file"
          done
          # Retry only Maven rate limiting, never compiler or validation errors.
          export_ok=0
          for attempt in 1 2 3; do
            rm -f /tmp/My-Forever-Pet-Godot-arm64.apk
            log="/tmp/kindria-apk-export-$attempt.log"
            if "$G" --verbose --headless --path my-forever-pet/godot-arcade --export-debug "Android Lab" /tmp/My-Forever-Pet-Godot-arm64.apk 2>&1 | tee "$log"; then
              export_ok=1
              break
            fi
            if ! grep -Ei 'status code 429|HTTP[^0-9]*429|Too Many Requests' "$log"; then exit 1; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "Maven rate limit detected; retrying after backoff"
            sleep "$((attempt * 60))"
          done
          test "$export_ok" -eq 1
          test -s /tmp/My-Forever-Pet-Godot-arm64.apk
          python3 my-forever-pet/godot-arcade/verify_apk_combat_packs.py /tmp/My-Forever-Pet-Godot-arm64.apk my-forever-pet/godot-arcade /tmp/kindria-apk-pack-verification.json
          "$SDK/build-tools/34.0.0/apksigner" verify /tmp/My-Forever-Pet-Godot-arm64.apk
          "$SDK/build-tools/34.0.0/aapt" dump badging /tmp/My-Forever-Pet-Godot-arm64.apk | grep -F "org.myforeverpet.godot"
          unzip -l /tmp/My-Forever-Pet-Godot-arm64.apk | grep -F lib/arm64-v8a/libgodot_android.so
          "$SDK/build-tools/34.0.0/aapt" dump xmltree /tmp/My-Forever-Pet-Godot-arm64.apk AndroidManifest.xml > /tmp/wallpaper-manifest.log
          grep -F org.myforeverpet.wallpaper.ForeverWallpaperService /tmp/wallpaper-manifest.log
          grep -F org.godotengine.plugin.v2.ForeverWallpaper /tmp/wallpaper-manifest.log
          grep -F android.permission.BIND_WALLPAPER /tmp/wallpaper-manifest.log
      - name: Record verified APK provenance and SHA256
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('/tmp/My-Forever-Pet-Godot-arm64.apk')
          record = {
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'godot_version': Path('/tmp/kindria-apk-engine.log').read_text().strip(),
              'apk_filename': apk.name,
              'apk_bytes': apk.stat().st_size,
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'architecture': 'arm64-v8a',
              'combat_gauntlet': 'passed',
              'device_performance_tested': False,
          }
          Path('/tmp/kindria-apk-provenance.json').write_text(json.dumps(record, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Kindria-Android-ARM64-test-${{ github.run_id }}
          path: |
            /tmp/My-Forever-Pet-Godot-arm64.apk
            /tmp/kindria-apk-provenance.json
          if-no-files-found: error
      - name: Preserve combat packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kindria-APK-combat-pack-evidence
          if-no-files-found: warn
          path: |
            /tmp/kindria-apk-export-*.log
            /tmp/kindria-apk-engine.log
            /tmp/kindria-apk-gauntlet.log
            /tmp/kindria-apk-provenance.json
            /tmp/kindria-apk-audio-pack.log
            /tmp/kindria-apk-frame-pack.log
            /tmp/kindria-apk-pack-verification.json
            my-forever-pet/godot-arcade/generated_combat_audio/index.json
            my-forever-pet/godot-arcade/generated_combat_frames/index.json
            my-forever-pet/godot-arcade/generated_combat_frames/particles.json
