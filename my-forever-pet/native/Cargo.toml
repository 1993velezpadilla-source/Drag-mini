[package]
name = "forever_pet"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
[lib]
crate-type = ["cdylib"]
[dependencies]
jni = "0.21"
egui = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
directories = "5"
byteorder = "1.5"
log = "0.4"
[profile.release]
lto = "fat"
codegen-units = 1
